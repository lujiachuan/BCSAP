[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "spectrum-platform"
version = "0.1.0"
description = "谱图检索、扫谱与自动调束统一平台"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.1,<3",
    "pydantic>=2.10,<3",
]

[project.optional-dependencies]
client = [
    "PySide6>=6.8,<7",
    "pyqtgraph>=0.13.7,<1",
]
service = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
]
database = [
    "alembic>=1.14,<2",
    "psycopg[binary]>=3.2,<4",
    "sqlalchemy>=2.0,<3",
]
dev = [
    "pytest>=8,<10",
    "ruff>=0.9,<1",
]

[project.scripts]
spectrum-client = "apps.desktop_client.main:main"
spectrum-instrument-service = "apps.instrument_service.main:main"
spectrum-data-service = "apps.data_service.main:main"

[tool.setuptools.packages.find]
include = ["apps*", "packages*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

